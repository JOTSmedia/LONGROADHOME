<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LONG ROAD HOME | PRIVATE SCREENING</title><style>@font-face{font-family:League;src:url('fonts/league-gothic.ttf');font-display:swap}@font-face{font-family:Plex;src:url('fonts/plex-sans.ttf');font-display:swap}*{box-sizing:border-box}body{margin:0;background:#111512;color:#eae8de;font:14px Plex,Arial,sans-serif;min-height:100svh;display:grid;place-items:center;padding:30px;text-transform:uppercase}main{width:min(100%,980px);display:grid;grid-template-columns:1.3fr 1fr;gap:10vw;align-items:center}h1{font:400 clamp(90px,12vw,170px)/.85 League,Impact,sans-serif;margin:0}h1 span{color:#d9bd7a}h2{font-size:14px;font-weight:500;margin:0 0 35px}label{display:block;margin-bottom:12px;font-size:12px;color:#a9b0a7}input,button{width:100%;min-height:56px;font:inherit;border:1px solid #667064;padding:15px;border-radius:0}input{background:#111512;color:#eae8de;caret-color:#d9bd7a}button{background:#d9bd7a;color:#111512;border:0;cursor:pointer;font-weight:500}button:hover{background:#eae8de}button:active{transform:translateY(1px)}:focus-visible{outline:2px solid #d9bd7a;outline-offset:5px}.error{color:#d9bd7a;min-height:42px;font-size:12px;line-height:1.5}::selection{background:#d9bd7a;color:#111512}@media(max-width:650px){main{grid-template-columns:1fr;gap:50px;max-width:360px}h1{font-size:104px}h2{margin-bottom:25px}}</style><style>[hidden]{display:none!important}button:disabled{opacity:.65;cursor:wait}</style></head><body><main><h1>LONG ROAD<br><span>HOME</span></h1><form><h2>PRIVATE SCREENING</h2><label for="password">SCREENING PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="error"><p id="error" class="error" role="alert"></p><button type="submit">ENTER SCREENING</button></form></main><script src="gate.js"></script><noscript>ENABLE JAVASCRIPT TO OPEN THE SCREENING.</noscript></body></html>
