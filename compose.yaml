services:
  preview:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      PASSWORD_HASH: ${PASSWORD_HASH:?Set PASSWORD_HASH}
      STATE_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - access-data:/data
    expose:
      - "4177"
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - preview
volumes:
  access-data:
  caddy-data:
  caddy-config:
